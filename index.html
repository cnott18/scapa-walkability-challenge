<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>SCAPA Walkability Challenge</title>

  <link
    rel="stylesheet"
    href="https://js.arcgis.com/4.33/esri/themes/light/main.css"
  />

  <script src="https://js.arcgis.com/4.33/"></script>

  <style>
    html,
    body,
    #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    #header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: white;
      padding: 10px 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.20);
    }

    #header h1 {
      margin: 0;
      font-size: 20px;
    }

    #header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: #555;
    }

    #viewDiv {
      position: absolute;
      top: 67px;
      bottom: 86px;
      height: auto;
    }

    #actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;

      background: white;

      padding: 10px;

      display: flex;
      gap: 10px;

      box-shadow: 0 -2px 6px rgba(0,0,0,0.20);
    }

    .action-button {
      flex: 1;

      border: none;
      border-radius: 8px;

      padding: 14px 8px;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    #sidewalkButton {
      background: #007ac2;
      color: white;
    }

    #sidewalkButton.active {
      background: #004f80;
      box-shadow: 0 0 0 3px #ffd54f;
    }

    #observationButton {
      background: #2e8540;
      color: white;
    }

    #message {
      position: absolute;

      top: 82px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      background: rgba(255,255,255,0.97);

      padding: 10px 16px;

      border-radius: 7px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.30);

      font-size: 14px;

      display: none;

      max-width: 85%;

      text-align: center;
    }

    #selectionPanel {
      position: absolute;

      left: 50%;
      bottom: 100px;

      transform: translateX(-50%);

      z-index: 20;

      width: 320px;
      max-width: calc(100% - 30px);

      background: white;

      border-radius: 10px;

      box-shadow: 0 3px 12px rgba(0,0,0,0.30);

      padding: 14px;

      display: none;
    }

    #selectionPanel h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    #selectionPanel p {
      margin: 5px 0;
      font-size: 13px;
      color: #555;
    }

    #continueAssessment {
      width: 100%;

      margin-top: 10px;

      padding: 12px;

      border: none;
      border-radius: 7px;

      background: #007ac2;
      color: white;

      font-weight: bold;
      font-size: 15px;

      cursor: pointer;
    }

    #cancelSelection {
      width: 100%;

      margin-top: 7px;

      padding: 9px;

      border: 1px solid #aaa;
      border-radius: 7px;

      background: white;

      font-size: 14px;

      cursor: pointer;
    }

    @media (max-width: 600px) {

      #header h1 {
        font-size: 18px;
      }

      #header p {
        font-size: 12px;
      }

      #actions {
        padding: 8px;
      }

      .action-button {
        font-size: 14px;
        padding: 13px 6px;
      }

    }
  </style>
</head>

<body>

  <div id="header">
    <h1>SCAPA Walkability Challenge</h1>

    <p>
      Explore downtown Columbia and help identify pedestrian conditions.
    </p>
  </div>


  <div id="message"></div>


  <div id="viewDiv"></div>


  <div id="selectionPanel">

    <h2>Sidewalk Selected</h2>

    <p>
      You've selected this sidewalk segment.
    </p>

    <p id="selectedId"></p>

    <button id="continueAssessment">
      Assess This Sidewalk
    </button>

    <button id="cancelSelection">
      Choose Another Sidewalk
    </button>

  </div>


  <div id="actions">

    <button
      id="sidewalkButton"
      class="action-button"
    >
      Assess a Sidewalk
    </button>


    <button
      id="observationButton"
      class="action-button"
    >
      Add Walkability Observation
    </button>

  </div>


  <script>

    require([

      "esri/Map",

      "esri/views/MapView",

      "esri/layers/FeatureLayer",

      "esri/widgets/Locate"

    ], function (

      Map,

      MapView,

      FeatureLayer,

      Locate

    ) {


      /*
       * -------------------------------------------------
       * READ-ONLY SIDEWALK REFERENCE
       * -------------------------------------------------
       */

      const sidewalkLayer = new FeatureLayer({

        portalItem: {
          id: "2ec5287ad77146818801312413aa80d4"
        },

        layerId: 1,

        title: "Sidewalks",

        outFields: [
          "OBJECTID",
          "GlobalID"
        ],

        popupEnabled: false

      });


      /*
       * -------------------------------------------------
       * MAP
       * -------------------------------------------------
       */

      const map = new Map({

        basemap: "streets-navigation-vector",

        layers: [
          sidewalkLayer
        ]

      });


      const view = new MapView({

        container: "viewDiv",

        map: map,

        center: [
          -81.0348,
          34.0007
        ],

        zoom: 16,

        constraints: {
          minZoom: 13
        }

      });


      /*
       * -------------------------------------------------
       * GPS BUTTON
       * -------------------------------------------------
       */

      const locateWidget = new Locate({

        view: view,

        useHeadingEnabled: false,

        goToOverride: function(view, options) {

          options.target.scale = 2500;

          return view.goTo(
            options.target
          );

        }

      });


      view.ui.add(
        locateWidget,
        "top-left"
      );


      /*
       * -------------------------------------------------
       * VARIABLES
       * -------------------------------------------------
       */

      let sidewalkSelectionMode = false;

      let selectedSidewalk = null;

      let sidewalkLayerView = null;

      let highlightHandle = null;


      const sidewalkButton =
        document.getElementById(
          "sidewalkButton"
        );


      const observationButton =
        document.getElementById(
          "observationButton"
        );


      const message =
        document.getElementById(
          "message"
        );


      const selectionPanel =
        document.getElementById(
          "selectionPanel"
        );


      const selectedId =
        document.getElementById(
          "selectedId"
        );


      /*
       * -------------------------------------------------
       * MESSAGE
       * -------------------------------------------------
       */

      function showMessage(text) {

        message.textContent = text;

        message.style.display = "block";

      }


      function hideMessage() {

        message.style.display = "none";

      }


      /*
       * -------------------------------------------------
       * START SIDEWALK SELECTION
       * -------------------------------------------------
       */

      sidewalkButton.addEventListener(

        "click",

        function() {

          sidewalkSelectionMode = true;

          sidewalkButton.classList.add(
            "active"
          );

          selectionPanel.style.display =
            "none";

          showMessage(
            "Tap the sidewalk segment you want to assess."
          );

        }

      );


      /*
       * -------------------------------------------------
       * MAP CLICK
       * -------------------------------------------------
       */

      view.on(

        "click",

        async function(event) {

          if (!sidewalkSelectionMode) {
            return;
          }


          const response =
            await view.hitTest(
              event,
              {
                include: [
                  sidewalkLayer
                ]
              }
            );


          const result =
            response.results.find(
              function(item) {

                return (
                  item.graphic &&
                  item.graphic.layer ===
                  sidewalkLayer
                );

              }
            );


          if (!result) {

            showMessage(
              "No sidewalk was selected. Tap directly on a green sidewalk line."
            );

            return;

          }


          /*
           * SAVE SELECTED SIDEWALK
           */

          selectedSidewalk =
            result.graphic;


          const globalId =
            selectedSidewalk.attributes.GlobalID;


          /*
           * REMOVE OLD HIGHLIGHT
           */

          if (highlightHandle) {

            highlightHandle.remove();

            highlightHandle = null;

          }


          /*
           * HIGHLIGHT SELECTED SIDEWALK
           */

          highlightHandle =
            sidewalkLayerView.highlight(
              selectedSidewalk
            );


          /*
           * UPDATE UI
           */

          sidewalkSelectionMode = false;

          sidewalkButton.classList.remove(
            "active"
          );

          hideMessage();


          selectedId.textContent =
            "Sidewalk ID: " +
            globalId;


          selectionPanel.style.display =
            "block";


          console.log(
            "Selected sidewalk GlobalID:",
            globalId
          );

        }

      );


      /*
       * -------------------------------------------------
       * CHOOSE ANOTHER SIDEWALK
       * -------------------------------------------------
       */

      document
        .getElementById(
          "cancelSelection"
        )
        .addEventListener(

          "click",

          function() {

            if (highlightHandle) {

              highlightHandle.remove();

              highlightHandle = null;

            }


            selectedSidewalk = null;


            selectionPanel.style.display =
              "none";


            sidewalkSelectionMode = true;


            sidewalkButton.classList.add(
              "active"
            );


            showMessage(
              "Tap another sidewalk segment."
            );

          }

        );


      /*
       * -------------------------------------------------
       * CONTINUE TO ASSESSMENT
       * -------------------------------------------------
       *
       * The actual assessment form comes next.
       */

      document
        .getElementById(
          "continueAssessment"
        )
        .addEventListener(

          "click",

          function() {

            if (!selectedSidewalk) {
              return;
            }


            const globalId =
              selectedSidewalk.attributes.GlobalID;


            showMessage(
              "Great — sidewalk " +
              globalId +
              " is ready for assessment."
            );


            selectionPanel.style.display =
              "none";


            /*
             * NEXT VERSION:
             *
             * Open assessment form and submit
             * SidewalkGlobalID = globalId
             *
             */

          }

        );


      /*
       * -------------------------------------------------
       * GENERAL OBSERVATION
       * -------------------------------------------------
       */

      observationButton.addEventListener(

        "click",

        function() {

          sidewalkSelectionMode = false;

          sidewalkButton.classList.remove(
            "active"
          );


          showMessage(
            "Walkability observation form will be connected after sidewalk assessment testing."
          );

        }

      );


      /*
       * -------------------------------------------------
       * INITIALIZE
       * -------------------------------------------------
       */

      view.whenLayerView(
        sidewalkLayer
      ).then(

        function(layerView) {

          sidewalkLayerView =
            layerView;


          console.log(
            "Sidewalk layer ready."
          );

        }

      );


      view.when(

        function() {

          console.log(
            "SCAPA Walkability Challenge ready."
          );

        }

      );


    });

  </script>

</body>
</html>
